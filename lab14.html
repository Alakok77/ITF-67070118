<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>
            <a id="user" href="https://github.com/Alakok77" target="_blank">Phiphop Thong-aun</a>
        </h1>
        <div class="profile" id="profile">
            <div id="img" class="img"></div>
            <div class="notify"><p>1</p></div>
        </div>

        <div class="container">
            <div class="flex-container">
                <p>Set the Username:</p>
                <input type="text" id="name">
                <button onclick="setName()">SET</button>
            </div>
            <div class="flex-container">
                <p>Set the Profile Image URL:</p>
                <input type="text" id="picname">
                <button onclick="setImage()">SET</button>
            </div>
            <div>
                <h1>Phone Number List</h1>
            </div>
            <div class="flex-container">
                <input type="text" id="cellName" placeholder="Name">
                <input type="text" id="cellNum" placeholder="Phone Number">
                <button onclick="updateRow()" id="btn">ADD</button>
                <button onclick="saveCSV()" id="save">EXPORT</button>
            </div>
        </div>

        <table id="table">
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Phone Number</th>
            </tr>
        </table>
    </div>

    <script>
        let count = 0;
        const phonenumber = [];

        function setName() {
            const input = document.getElementById("name");
            const username = document.getElementById("user");
            username.textContent = input.value;
        }

        function setImage() {
            const picture = document.getElementById("picname");
            const profile = document.getElementById("img");
            profile.style.backgroundImage = "url(" + picture.value + ")";
            picture.value = "";
        }

        function updateRow() {
            count++;
            const name = document.getElementById("cellName").value;
            const phone = document.getElementById("cellNum").value;

            const row = document.createElement("tr");
            row.innerHTML = `<td>${count}</td><td>${name}</td><td>${phone}</td>`;
            document.getElementById("table").appendChild(row);
            
            phonenumber.push([count, name, phone]);

            document.getElementById("cellName").value = "";
            document.getElementById("cellNum").value = "";
        }

        function saveCSV() {
            const csvContent = phonenumber.map(row => row.join(",")).join("\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "data.csv");
            link.style.visibility = "hidden";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
